# Canonical registry of ontology documentation sites linked from RITSO.
# path: published URL path under the site base (e.g. https://isotc204.org/<path>/)
# repo: sibling checkout directory name under the parent GitHub folder
# group: nav grouping in ritso (imported | cdm | its)
# enabled: include in local multi-site preview builds

publish_host: https://isotc204.org
local_host: http://127.0.0.1:8080

sites:
